        - generic [ref=e142]:
          - heading "On comparison bias." [level=3] [ref=e143]
          - paragraph [ref=e144]: "Most bias detectors score articles in isolation against a fixed left/right rubric. Comparison bias is different: the model is trained to score an article relative to how the same factual story is framed across a curated reference corpus of 10,247 hours of paired coverage. For every story, the model sees how Reuters wrote the headline, how the AP framed the lede, how MSNBC chose its verbs, and how Fox structured its quotes — then learns the latent axes along which they diverge."
          - heading "Why eight dimensions." [level=3] [ref=e145]
          - paragraph [ref=e146]: A single left-right number collapses what's actually four orthogonal signals — economic framing, social framing, establishment posture, sensationalism — and three lexical signals — loaded language density, source diversity, and the headline-body skew. Each is its own classification head trained against the comparison corpus; the displayed score is a learned weighted composite. Outlet identity is not an input — every score is computed from the article's text alone.
